# Merge into .gitlab-ci.yml in the client repo.
# Badge: Settings > CI/CD > General pipelines > Pipeline status badge, or
#   https://gitlab.com/<group>/<project>/badges/main/pipeline.svg?job=guardrails
guardrails:
  image: python:3.12-slim
  stage: test
  script:
    - guardrails/tests/smoke.sh
    - python3 -c "import json; c=json.load(open('guardrails/config.json')); assert c['protected_paths'] and c['deny_patterns']; print('policy ok')"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
